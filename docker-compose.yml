x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: ${APP_ENV:-development}
    APP_NAME: ${APP_NAME:-SELA Service Evidence Uploader}
    APPLICATION_ID: ${APPLICATION_ID:-sela}
    DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app?sslmode=disable&application_name=sela
    QUARANTINE_DIR: /var/lib/sela/quarantine
  depends_on:
    db: {condition: service_healthy}
  networks: [default, scanner]
  volumes: [quarantine:/var/lib/sela]
  read_only: true
  tmpfs: [/tmp:size=64m,noexec,nosuid]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  stop_grace_period: 20s
  restart: unless-stopped
  deploy:
    resources:
      limits: {cpus: '1.0', memory: 512M}
services:
  web:
    <<: *app
    ports: ["${APP_PORT:-8080}:8080"]
  worker:
    <<: *app
    entrypoint: ["/app/worker"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data, ./migrations:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 1G}
networks:
  scanner:
    external: true
    name: ${SCANNER_NETWORK:-scanner_private}
volumes:
  postgres_data:
  quarantine:
