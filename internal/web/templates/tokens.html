{{define "content"}}<header class="page-header"><div><p class="eyebrow">Integrasi</p><h1>Token API</h1><p>Buat token terbatas untuk integrasi. Simpan token di secret manager.</p></div></header>{{if .Message}}<div class="notice" role="status">{{.Message}}</div>{{end}}<section class="card"><div class="card-header"><div><h2>Buat token baru</h2><p>Token hanya ditampilkan satu kali dan berlaku 30 hari.</p></div></div><form method="post" action="/settings/tokens"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><div class="field"><label for="name">Nama token</label><input id="name" name="name" maxlength="80" placeholder="Contoh: Integrasi laporan" required></div><fieldset><legend>Izin token</legend><label><input type="checkbox" name="scopes" value="services:read"> Baca service</label><label><input type="checkbox" name="scopes" value="evidence:read"> Baca evidence</label><label><input type="checkbox" name="scopes" value="evidence:write"> Unggah evidence</label></fieldset><div class="actions"><button type="submit">Buat token 30 hari</button></div></form></section>{{end}}
